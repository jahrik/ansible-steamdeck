---
- name: Check dswarm wrapper exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/dswarm"
  register: dswarm_bin

- name: Assert dswarm is installed
  ansible.builtin.assert:
    that: dswarm_bin.stat.exists

- name: Check docker-cli binary exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/docker-cli"
  register: docker_cli_bin

- name: Assert docker-cli is installed
  ansible.builtin.assert:
    that: docker_cli_bin.stat.exists

- name: Check podman-compose binary exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/podman-compose"
  register: podman_compose_bin

- name: Assert podman-compose is installed
  ansible.builtin.assert:
    that: podman_compose_bin.stat.exists

- name: Check dind container is running
  ansible.builtin.command: podman ps --filter name=dind --filter status=running --quiet
  register: dind_running
  changed_when: false

- name: Assert dind container is running
  ansible.builtin.assert:
    that: dind_running.stdout != ''
    fail_msg: "dind container is not running"

- name: Check Docker Swarm is initialized
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/.local/bin/docker-cli --host {{ dind_host }} info --format '{{ '{{' }}.Swarm.LocalNodeState{{ '}}' }}'"
  register: swarm_state
  changed_when: false

- name: Assert Docker Swarm is initialized
  ansible.builtin.assert:
    that: swarm_state.stdout == 'active'
    fail_msg: "Docker Swarm is not initialized (state: {{ swarm_state.stdout }})"

- name: Check dind container has a restart policy
  ansible.builtin.command: podman inspect dind --format '{{ '{{' }}.HostConfig.RestartPolicy.Name{{ '}}' }}'
  register: dind_restart_policy
  changed_when: false

- name: Assert dind container restarts on boot
  ansible.builtin.assert:
    that: dind_restart_policy.stdout == 'always'
    fail_msg: "dind container has no restart=always policy, it will not survive a reboot"

- name: Check lingering is enabled for the user
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
  register: linger_check

- name: Assert lingering is enabled
  ansible.builtin.assert:
    that: linger_check.stat.exists
    fail_msg: "lingering is not enabled, user services will not start at boot without a login"

- name: Check podman-restart user service is enabled
  ansible.builtin.command: systemctl --user is-enabled podman-restart.service
  register: podman_restart_enabled
  changed_when: false
  failed_when: false

- name: Assert podman-restart user service is enabled
  ansible.builtin.assert:
    that: podman_restart_enabled.stdout == 'enabled'
    fail_msg: "podman-restart.service is not enabled, restart=always containers will not be reapplied at boot"
